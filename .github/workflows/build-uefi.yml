name: Compilar UEFI gta4lwifi (SM-T500)

# Uso: sube esta carpeta a un repositorio propio de GitHub y lanza el flujo
# desde la pestaña Actions > "Compilar UEFI gta4lwifi" > Run workflow.
# Al terminar, descarga el artefacto Mu-gta4lwifi-DEBUG (recomendado para la
# primera prueba) o Mu-gta4lwifi-RELEASE.

on:
  workflow_dispatch:
    inputs:
      dtb:
        description: 'DTB: default (board-id 0 0, como el port gta4l) o boardid (board-id 0x1000b, el de tu tablet)'
        type: choice
        default: default
        options: [default, boardid]
      verbose:
        description: 'Log de depuracion: normal o detallado (anade PAGE, EVENT, VARIABLE y BLKIO; sin la tabla GCD)'
        type: choice
        default: normal
        options: [normal, detallado]
      memmap:
        description: 'Mapa de memoria: original (el del port gta4l) o lime (heap de la UEFI movido a 0x63900000 con QSEE/TZApps reservados, como el Redmi 9T que si arranca Windows)'
        type: choice
        default: original
        options: [original, lime, dtb]
      rtc:
        description: 'Reloj: original (dia 0 al arrancar, invalido) o dia1 (suma 1 al dia para que sea valido)'
        type: choice
        default: original
        options: [original, dia1]
      heartbeat:
        description: 'Latido: no, o si (cada 5 s imprime la direccion que ejecuta la CPU; sirve para ver donde se queda parado bootmgr)'
        type: choice
        default: no
        options: ['no', 'si']
      xhci:
        description: 'Drivers XHCI (USB host): si (como el port gta4l) o no (como lime, que no los carga)'
        type: choice
        default: 'si'
        options: ['si', 'no']

env:
  CI_BUILD: "true"
  UPSTREAM_REPO: https://github.com/Project-Silicium/Mu-Silicium.git
  # Commit de Mu-Silicium con el que se preparó el port. Cámbialo solo si sabes por qué.
  UPSTREAM_REF: 4bd8ae83bf37de41777f19e0777db70f59383a6d

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: [DEBUG, RELEASE]
    steps:
      - name: Descargar este repositorio
        uses: actions/checkout@v4
        with:
          path: kit

      - name: Descargar Mu-Silicium (commit fijado)
        run: |
          git clone "$UPSTREAM_REPO" upstream
          cd upstream
          git checkout "$UPSTREAM_REF"
          # Silicium-ACPI debe estar descargado antes de copiar nuestros ficheros encima.
          git submodule update --init Silicium-ACPI

      - name: Aplicar el port gta4lwifi
        run: cp -r kit/overlay/. upstream/

      - name: Mapa de memoria estilo lime
        if: ${{ inputs.memmap == 'lime' }}
        run: cp -r kit/variants/lime-memmap/. upstream/

      - name: Mapa de memoria fiel al DTB (lime + regiones reservadas del DTB)
        if: ${{ inputs.memmap == 'dtb' }}
        run: cp -r kit/variants/dtb-memmap/. upstream/

      - name: Sin drivers XHCI (como lime)
        if: ${{ inputs.xhci == 'no' }}
        run: |
          d=upstream/Platforms/Samsung/gta4lwifiPkg/Include
          grep -c "XhciDxe\|XhciPciEmulationDxe" $d/APRIORI.inc $d/DXE.inc
          sed -i '/XhciPciEmulationDxe\|XhciDxe/d' $d/APRIORI.inc $d/DXE.inc
          ! grep -n "Xhci" $d/*.inc

      - name: Reloj con dia valido
        if: ${{ inputs.rtc == 'dia1' }}
        run: |
          f=upstream/Silicon/Silicium/SiliciumNullPkg/Library/RealTimeClockLibNull/RealTimeClockNull.c
          grep -q "Time->Day = (ElapsedSeconds / SecondsPerDay);" "$f"
          sed -i 's|Time->Day = (ElapsedSeconds / SecondsPerDay);|Time->Day = (ElapsedSeconds / SecondsPerDay) + 1;|' "$f"
          grep -n "Time->Day" "$f"

      - name: Latido del temporizador (parche git de Mu_Basecore)
        if: ${{ inputs.heartbeat == 'si' }}
        run: |
          cp kit/variants/heartbeat/Heartbeat.patch upstream/Resources/MuPatches/Heartbeat.patch
          f=upstream/build_uefi.py
          test "$(grep -c '"Usb-Bus.patch"\]' "$f")" = "2"
          sed -i 's/"Usb-Bus.patch"\]/"Usb-Bus.patch", "Heartbeat.patch"]/g' "$f"
          grep -n 'Heartbeat.patch' "$f"

      - name: Elegir DTB
        if: ${{ inputs.dtb == 'boardid' }}
        run: cp upstream/Resources/DTBs/gta4lwifi-boardid.dtb upstream/Resources/DTBs/gta4lwifi.dtb

      - name: Log de depuracion detallado
        if: ${{ inputs.verbose == 'detallado' }}
        run: |
          f=upstream/Silicon/Silicium/SiliciumPkg/SiliciumPkg.dsc.inc
          grep -q "PcdDebugPrintErrorLevel|0x8007EE0F" "$f"
          sed -i 's/PcdDebugPrintErrorLevel|0x8007EE0F/PcdDebugPrintErrorLevel|0x800FFF2F/' "$f"
          grep -n "PcdDebugPrintErrorLevel" "$f"

      - name: Compilar
        working-directory: upstream
        run: |
          bash ./setup_env.sh -p apt
          export CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-
          python3 build_uefi.py -d gta4lwifi -r ${{ matrix.release }} -c

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: Mu-gta4lwifi-${{ inputs.dtb }}-${{ inputs.verbose }}-mem${{ inputs.memmap }}-rtc${{ inputs.rtc }}-hb${{ inputs.heartbeat }}-xhci${{ inputs.xhci }}-${{ matrix.release }}
          path: |
            upstream/Mu-gta4lwifi.img
            upstream/Build/gta4lwifiPkg/${{ matrix.release }}_CLANGPDB/FV/SILICIUM_UEFI.fd
          if-no-files-found: error
